name: FEWS-BMI smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fews-bmi-smoke-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fews-bmi-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      F90: gfortran
      CC: gcc
      NETCDFALTERNATIVE: /usr/include

    steps:
      - name: Check out source and test data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            src/troute-network/pyproject.toml
            src/troute-routing/pyproject.toml
            src/troute-config/pyproject.toml
            src/troute-nwm/pyproject.toml

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gfortran libnetcdf-dev libnetcdff-dev
          gfortran --version
          nc-config --fflags
          nc-config --flibs

      - name: Install Python and BMI dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install bmipy fiona
          python -m pip --version

      - name: Compile and install T-Route
        run: |
          mkdir -p test/fews-bmi-smoke-test/output
          bash ./compiler.sh no-e 2>&1 | tee test/fews-bmi-smoke-test/output/build.log
          python -m pip show troute.network troute.routing troute.config nwm_routing bmipy

      - name: Run FEWS-BMI smoke test with synthetic lateral inflows
        run: |
          unset LD_LIBRARY_PATH
          python test/fews-bmi-smoke-test/run_fews_bmi_smoke.py \
            2>&1 | tee test/fews-bmi-smoke-test/output/smoke.log

      - name: Upload build logs and BMI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fews-bmi-smoke-test-results
          path: test/fews-bmi-smoke-test/output/
          if-no-files-found: warn
          retention-days: 14
