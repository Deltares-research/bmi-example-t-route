# This example uses one BMI instance for all three segments, with lateral inflows only.
# In Delft-FEWS, package this configuration in the ModuleDataSet and adapt paths
# to the model working directory. The standalone driver uses the repository root.
bmi_parameters:
  # Static field names expected by the BMI/network configuration.
  # Geometry and channel attributes are read from the GeoPackage in this setup.
  flowpath_columns:
    - id
    - toid
    - lengthkm
  attributes_columns:
    - id
    - rl_gages
    - rl_NHDWaterbodyComID
    - MusK
    - MusX
    - n
    - So
    - ChSlp
    - BtmWdth
    - nCC
    - TopWdthCC
    - TopWdth
    - length_m
  waterbody_columns: []
  network_columns: []

log_parameters:
  showtiming: false
  log_level: CRITICAL

network_topology_parameters:
  supernetwork_parameters:
    # Also the geometry source for FEWS location sets and map layers.
    # BMI uses numeric segment IDs (e.g. 10245), not downstream nexus IDs.
    geo_file_path: test/fews-bmi-smoke-test/gauge_01069700.gpkg
    network_type: HYFeaturesNetwork
  waterbody_parameters:
    break_network_at_waterbodies: false

compute_parameters:
  # Route all segments internally; no split upstream/reservoir/downstream components.
  parallel_compute_method: serial
  compute_kernel: V02-structured
  assume_short_ts: true
  cpu_pool: 1
  restart_parameters:
    # Cold-start reference time, with no restart files supplied.
    # Align with the requested FEWS run when deploying this example.
    start_datetime: "2015-12-01_00:00:00"
  forcing_parameters:
    # Seconds per routing step; the local driver supplies new lateral inflows
    # through BMI before every 300-second update.
    dt: 300
    qts_subdivisions: 1
    # Twelve steps describe the bundled one-hour example.
    nts: 12
    # Existing directory required by the shared validator, not a file input source.
    # Lateral inflows are supplied through BMI; no NEXOUT files are read here.
    qlat_input_folder: test/fews-bmi-smoke-test
  data_assimilation_parameters:
    streamflow_da:
      streamflow_nudging: false
      diffusive_streamflow_nudging: false
    reservoir_da:
      reservoir_persistence_da:
        reservoir_persistence_usgs: false
        reservoir_persistence_usace: false
      reservoir_rfc_da:
        reservoir_rfc_forecasts: false

# No native T-Route output files configured: results are read through BMI.
# The standalone driver can write CSV under output/; in Delft-FEWS the FEWS-BMI
# adaptor handles NetCDF results. This setting does not configure NetCDF exchange.
output_parameters: {}
